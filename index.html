<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/public/img/logo.png" /> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <title>Portfolio Turpal-ali</title>

  <style>
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1a1a1a; /* Dark background color */
      color: #fff; /* White text color */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999; /* Ensure it's on top of everything */
      font-family: 'Arial', sans-serif; /* Simple, fast-loading font */
      transition: opacity 0.5s ease-out; /* Smooth fade-out effect */
      opacity: 1; /* Starts fully visible */
    }
    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none; /* Prevents interaction after it fades */
    }
    #loading-screen .loading-text {
      font-size: 1.5em;
      margin-bottom: 20px;
    }
    #loading-screen .progress-bar-container {
      width: 60%;
      max-width: 400px;
      height: 20px;
      background-color: #333; /* Background for the progress bar track */
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5); /* Inner shadow for depth */
    }
    #loading-screen .progress-bar {
      height: 100%;
      width: 0%; /* Starts empty */
      background-color: #007bff; /* Progress color (e.g., Bootstrap primary blue) */
      border-radius: 10px;
      transition: width 0.2s ease-out; /* Smooth progression */
    }
    #loading-screen .progress-percentage {
      margin-top: 10px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <noscript>
    <strong>Nous sommes désolés, mais ce portfolio ne fonctionne pas correctement sans JavaScript activé. Veuillez l'activer pour continuer.</strong>
  </noscript>

  <div id="loading-screen">
    <img src="/img/loading.gif" alt="Logo de chargement" class="loading-logo">
    <div class="loading-text">Chargement en cours...</div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="loading-progress-bar"></div>
    </div>
    <div class="progress-percentage" id="loading-percentage">0%</div>
  </div>

  <div id="app"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const progressBar = document.getElementById('loading-progress-bar');
      const progressPercentage = document.getElementById('loading-percentage');
      let progress = 0;
      const interval = setInterval(() => {
        if (progress < 90) { // Simulate quick progress up to 90%
          progress += Math.floor(Math.random() * 5) + 1; // Add some random steps
          if (progress > 90) progress = 90; // Cap at 90%
          if (progressBar) progressBar.style.width = progress + '%';
          if (progressPercentage) progressPercentage.textContent = progress + '%';
        } else {
          clearInterval(interval);
        }
      }, 100); // Update every 100ms
    });
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
